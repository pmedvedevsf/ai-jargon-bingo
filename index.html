<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>AI Jargon Bingo</title>
<style>
:root{--ink:#14213d;--mut:#4a5568;--bg:#f4f1ea;--card:#fff;--line:#c9c3b6;--mark:#0b5f5a;--markink:#fff;--win:#ffd34d;--winink:#14213d;--free:#e6ecf7;--focus:#b3260e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
header{width:100%;max-width:520px;padding:10px 4px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:1.25rem;margin:0;letter-spacing:.01em}
h1 span{color:var(--mark)}
.sub{margin:0 0 6px;width:100%;max-width:520px;padding:0 4px;color:var(--mut);font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-weight:600}
.btn.pri{background:var(--ink);color:#fff}
main{width:100%;max-width:520px;flex:1}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;list-style:none;margin:0;padding:0}
.cell{position:relative;aspect-ratio:1/1;min-height:56px;width:100%;padding:2px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-weight:600;font-size:clamp(.62rem,2.9vw,.85rem);line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;hyphens:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color .15s,color .15s}
.cell[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:var(--markink)}
.cell[aria-pressed="true"]::after{content:"\2713";position:absolute;top:1px;right:4px;font-size:.7rem;opacity:.9}
.cell.free{hyphens:none;overflow-wrap:normal;background:var(--free);border-color:var(--ink);font-size:clamp(.55rem,2.5vw,.75rem)}
.cell.free[aria-pressed="true"]{background:var(--mark)}
.cell.win{background:var(--win)!important;color:var(--winink)!important;border-color:var(--ink)!important}
.cell.win::after{color:var(--winink)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
#status{font-weight:600;min-height:1.4em}
footer{width:100%;max-width:520px;padding:10px 4px 14px;color:var(--mut);font-size:.8rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
#bingo{position:fixed;inset:0;z-index:10;background:var(--ink);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:auto}
#bingo.on{display:flex}
#bingo h2{font-size:clamp(3rem,18vw,6rem);margin:0;color:var(--win);letter-spacing:.04em;animation:pop .6s ease-out both}
#bingo>*:not(.confetti){position:relative;z-index:1}
#bingo p{margin:.3em 0;font-size:1.1rem}
#code{font:700 clamp(3rem,20vw,5.5rem)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;background:#fff;color:var(--ink);border-radius:14px;padding:.15em .3em .15em .45em;margin:12px 0}
#bingo .terms{max-width:30em;color:#e8ecf5;font-size:.95rem}
#bingo .btn{margin-top:14px;background:#fff;color:var(--ink);border-color:#fff}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
dialog{border:3px solid var(--ink);border-radius:14px;padding:20px;max-width:340px;color:var(--ink);background:#fff}
dialog::backdrop{background:rgba(20,33,61,.6)}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <h1>AI Jargon <span>Bingo</span></h1>
  <button class="btn" id="newBtn" type="button">New card</button>
</header>
<p class="sub">Tap a square when you hear the term. Get a line to win!</p>
<main>
  <ul id="grid" aria-label="Bingo card"></ul>
  <div class="bar"><div id="status" role="status" aria-live="polite"></div><button class="btn" id="reopen" type="button" hidden>Show win code</button></div>
</main>
<footer><span>No data leaves your phone.</span><span>Session: Connected Data, Smarter Government</span></footer>

<div id="bingo" role="dialog" aria-modal="true" aria-labelledby="bt" aria-hidden="true">
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <h2 id="bt">BINGO!</h2>
  <p>Shout it out, then show this screen.</p>
  <div id="code" aria-label="Verification code"></div>
  <p id="wtime"></p>
  <p class="terms" id="wterms"></p>
  <button class="btn" id="closeBingo" type="button">Back to card</button>
</div>

<dialog id="dlg" aria-labelledby="dt">
  <h3 id="dt" style="margin:0 0 6px">Get a new card?</h3>
  <p style="margin:0">Your current card and marks will be lost.</p>
  <div class="row"><button class="btn" id="no" type="button">Keep card</button><button class="btn pri" id="yes" type="button">New card</button></div>
</dialog>

<script>
(function(){
"use strict";
var TERMS=["agentic","MCP","gateway","vibe coding","human in the loop","guardrails","hallucination","context engineering","context window","harness","subagent","multi-agent","orchestration","RAG","grounding","tokens","inference","fine-tuning","open-weight","frontier model","reasoning model","skills","digital labor","forward-deployed engineer","zero data retention","trust layer","kill switch","rogue agent","shadow AI","observability","determinism","provenance","sandbox","AGI","world models","slop","single source of truth","zero copy","data sovereignty","prompt","legacy system","interoperability","digital front door"];
var FREE="FREE: ‘Trusted AI’";
var KEY="aiJargonBingo.v1";
var LINES=[];
for(var r=0;r<5;r++){LINES.push([0,1,2,3,4].map(function(c){return r*5+c}))}
for(var c=0;c<5;c++){LINES.push([0,1,2,3,4].map(function(r){return r*5+c}))}
LINES.push([0,6,12,18,24]);LINES.push([4,8,12,16,20]);

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newSeed(){
  var a=new Uint32Array(1);
  if(window.crypto&&crypto.getRandomValues){crypto.getRandomValues(a);return a[0]||1}
  return (Math.random()*4294967295)>>>0||1;
}
function layout(seed){
  var rnd=mulberry(seed),pool=TERMS.slice();
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t}
  var cells=pool.slice(0,24);cells.splice(12,0,FREE);return cells;
}
var AL="23456789ABCDEFGHJKMNPQRSTUVWXYZ"; // no ambiguous chars
function codeFor(seed,marks){
  var s=seed+":"+marks.join(","),h=2166136261;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  h=Math.imul(h^h>>>15,2246822519)>>>0;
  var out="";for(var k=0;k<4;k++){out+=AL[h%AL.length];h=Math.floor(h/AL.length)+Math.imul(k+1,40503)>>>0}
  return out;
}
var state=null;
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&typeof s.seed==="number"&&Array.isArray(s.marks))return s}catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function fresh(){state={seed:newSeed(),marks:[12],win:null};save()}
var $=function(id){return document.getElementById(id)};
var cells,btns=[];
function findLine(){
  for(var i=0;i<LINES.length;i++){if(LINES[i].every(function(n){return state.marks.indexOf(n)>-1}))return LINES[i]}
  return null;
}
function build(){
  cells=layout(state.seed);btns=[];var g=$("grid");g.innerHTML="";
  cells.forEach(function(t,i){
    var li=document.createElement("li"),b=document.createElement("button");
    b.type="button";b.className="cell"+(i===12?" free":"");b.textContent=t;b.dataset.i=i;
    b.addEventListener("click",function(){toggle(i)});
    li.appendChild(b);g.appendChild(li);btns.push(b);
  });
}
function render(){
  btns.forEach(function(b,i){
    var on=state.marks.indexOf(i)>-1;
    b.setAttribute("aria-pressed",on);
    b.setAttribute("aria-label",cells[i]+(on?", marked":", not marked"));
    b.classList.toggle("win",!!(state.win&&state.win.line.indexOf(i)>-1));
  });
  var n=state.marks.length-1;
  $("status").textContent=state.win?"BINGO! Code "+state.win.code:n+" marked";
  $("reopen").hidden=!state.win;
}
function fmt(ts){return new Date(ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"})}
function toggle(i){
  if(i===12)return;
  var k=state.marks.indexOf(i);
  if(k>-1)state.marks.splice(k,1);else state.marks.push(i);
  state.marks.sort(function(a,b){return a-b});
  var line=findLine();
  if(line&&!state.win){
    state.win={line:line,t:Date.now(),code:codeFor(state.seed,state.marks)};
    save();render();showBingo();return;
  }
  if(!line&&state.win){state.win=null}
  save();render();
}
var lastFocus=null;
function showBingo(){
  var w=state.win;$("code").textContent=w.code;
  $("wtime").textContent="Time: "+fmt(w.t);
  $("wterms").textContent="Winning line: "+w.line.map(function(n){return n===12?"FREE":cells[n]}).join(" • ");
  var cf=$("confetti");
  if(!cf.children.length){var cols=["#ffd34d","#4cc9c0","#ff7a59","#fff","#9ab6ff"];
    for(var i=0;i<40;i++){var e=document.createElement("i");e.style.left=(i*2.5+Math.random()*2)+"%";e.style.background=cols[i%5];e.style.animationDuration=(2.5+Math.random()*3)+"s";e.style.animationDelay=(-Math.random()*5)+"s";cf.appendChild(e)}}
  lastFocus=document.activeElement;
  var o=$("bingo");o.classList.add("on");o.setAttribute("aria-hidden","false");$("closeBingo").focus();
  if(navigator.vibrate){try{navigator.vibrate([120,60,120])}catch(e){}}
}
function hideBingo(){var o=$("bingo");o.classList.remove("on");o.setAttribute("aria-hidden","true");if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$("closeBingo").addEventListener("click",hideBingo);
$("reopen").addEventListener("click",showBingo);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("bingo").classList.contains("on"))hideBingo()});
var dlg=$("dlg");
$("newBtn").addEventListener("click",function(){
  if(dlg.showModal)dlg.showModal();else if(confirm("Get a new card? Your marks will be lost.")){reset()}
});
$("no").addEventListener("click",function(){dlg.close()});
$("yes").addEventListener("click",function(){dlg.close();reset()});
function reset(){fresh();build();render();hideBingo()}
state=load()||(fresh(),state);
build();render();
})();
</script>
</body>
</html>
